{% extends "checklist/base.html" %}

{% block title %}Registro de cuenta | Bug Hunter{% endblock %}

{% block content %}
    <section class="create-panel">
        <p class="eyebrow">Crear cuenta</p>
        <h1>Registro de cuenta</h1>

        <form method="post" class="create-form">
            {% csrf_token %}
            <div>
                <label for="id_username">Nombre de usuario</label>
                <input type="text" name="username" id="id_username" required placeholder="Escribe tu usuario">
            </div>

            <div>
                <label for="id_email">Correo electrónico</label>
                <input type="email" name="email" id="id_email" required placeholder="Escribe tu correo">
            </div>

            <div>
                <label for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password" required placeholder="Escribe tu contraseña">
            </div>

            <div class="form-actions">
                <button type="submit">Registrarme</button>
            </div>

            <div class="form-actions">
                <a href="{% url 'login' %}">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </form>
    </section>
{% endblock %}
