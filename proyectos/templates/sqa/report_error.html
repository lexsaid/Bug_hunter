<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error de Reporte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="alert alert-warning" role="alert">
        <h4 class="alert-heading">Atención</h4>
        <p>{{ error_message }}</p>
        <hr>
        {% if project %}
            <a href="{% url 'proyectos:detalle_proyecto' project.id %}" class="btn btn-primary">Volver al proyecto</a>
        {% else %}
            <a href="{% url 'proyectos:lista_proyectos' %}" class="btn btn-primary">Aceptar</a>
        {% endif %}
    </div>
</body>
</html>
