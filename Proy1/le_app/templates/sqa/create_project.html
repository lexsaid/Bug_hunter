<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Proyecto - SQA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>Añadir Proyecto</h2>
    <form method="post" id="projectForm">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success" id="saveBtn">Guardar</button>
        <button type="button" class="btn btn-danger" id="cancelBtn">Cancelar</button>
    </form>

    <script>
        // Implementación del Caso Alternativo 1 (CU-01): Advertencia de cancelación
        document.getElementById('cancelBtn').addEventListener('click', function() {
            let confirmation = confirm("¡Advertencia! Se perderá el progreso actual.");
            if (confirmation) {
                window.location.href = "{% url 'project_list' %}"; // Devuelve al menú
            }
        });
    </script>
</body>
</html>
